<svg width="100%" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>MoDiff UNet layer architecture</title>
<desc>Overview of the LSUN-Churches LDM-8 UNet pipeline, plus zoomed structural views of a ResBlock and an AttentionBlock showing which sub-parts are Conv, Linear/GEMM, Attention, or normalization/glue.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; }
  .t { font-size: 14px; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.5; }
  .c-blue rect, .c-blue { fill: #E6F1FB; stroke: #378ADD; }
  .c-blue text.th { fill: #0C447C; }
  .c-blue text.ts { fill: #185FA5; }
  .c-purple rect, .c-purple { fill: #EEEDFE; stroke: #7F77DD; }
  .c-purple text.th { fill: #3C3489; }
  .c-purple text.ts { fill: #534AB7; }
  .c-gray rect, .c-gray { fill: #F1EFE8; stroke: #888780; }
  .c-gray text.th { fill: #444441; }
  .c-gray text.ts { fill: #5F5E5A; }
  .c-amber rect, .c-amber { fill: #FAEEDA; stroke: #BA7517; }
  .c-amber text.th { fill: #633806; }
  .c-amber text.ts { fill: #854F0B; }
  .c-coral rect, .c-coral { fill: #FAECE7; stroke: #D85A30; }
  .c-coral text.th { fill: #712B13; }
  .c-coral text.ts { fill: #993C1D; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="40" y="30">MoDiff UNet (LSUN-Churches, LDM-8) — where each layer type lives</text>
<text class="ts" x="40" y="46">model_channels=192 · channel_mult=[1,2,2,4,4] · num_res_blocks=2 · attention at ds∈{1,2,4,8}</text>

<!-- Overview pipeline -->
<g class="c-blue">
  <rect x="40" y="70" width="100" height="64" rx="8"/>
  <text class="th" x="90" y="98" text-anchor="middle">Input</text>
  <text class="ts" x="90" y="118" text-anchor="middle">Conv 3×3</text>
</g>
<g class="c-purple">
  <rect x="160" y="70" width="100" height="64" rx="8"/>
  <text class="th" x="210" y="98" text-anchor="middle">Encoder</text>
  <text class="ts" x="210" y="118" text-anchor="middle">5 levels ↓</text>
</g>
<g class="c-purple">
  <rect x="280" y="70" width="100" height="64" rx="8"/>
  <text class="th" x="330" y="98" text-anchor="middle">Middle</text>
  <text class="ts" x="330" y="118" text-anchor="middle">lowest res</text>
</g>
<g class="c-purple">
  <rect x="400" y="70" width="100" height="64" rx="8"/>
  <text class="th" x="450" y="98" text-anchor="middle">Decoder</text>
  <text class="ts" x="450" y="118" text-anchor="middle">5 levels ↑</text>
</g>
<g class="c-blue">
  <rect x="520" y="70" width="100" height="64" rx="8"/>
  <text class="th" x="570" y="98" text-anchor="middle">Output</text>
  <text class="ts" x="570" y="118" text-anchor="middle">norm+conv</text>
</g>
<line x1="140" y1="102" x2="158" y2="102" class="arr" marker-end="url(#arrow)"/>
<line x1="260" y1="102" x2="278" y2="102" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="102" x2="398" y2="102" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="102" x2="518" y2="102" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="155" text-anchor="middle">Encoder ⇄ Decoder skip connections (concat) at each matching resolution, not drawn</text>

<!-- Section: ResBlock zoom -->
<g class="c-gray">
  <rect x="40" y="175" width="600" height="215" rx="20"/>
</g>
<text class="th" x="60" y="201">Inside a ResBlock — repeated 35× (14 encoder, 2 middle, 19 decoder)</text>
<text class="ts" x="60" y="217">in_layers → time-embedding modulation → out_layers → + skip</text>

<g class="c-amber">
  <rect x="340" y="230" width="125" height="40" rx="8"/>
  <text class="th" x="402" y="248" text-anchor="middle">Time emb</text>
  <text class="ts" x="402" y="264" text-anchor="middle">SiLU + Linear</text>
</g>
<line x1="402" y1="270" x2="402" y2="289" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
  <rect x="60" y="290" width="125" height="60" rx="8"/>
  <text class="th" x="122" y="316" text-anchor="middle">GN + SiLU</text>
  <text class="ts" x="122" y="336" text-anchor="middle">pre-conv</text>
</g>
<g class="c-blue">
  <rect x="200" y="290" width="125" height="60" rx="8"/>
  <text class="th" x="262" y="316" text-anchor="middle">Conv 3×3</text>
  <text class="ts" x="262" y="336" text-anchor="middle">ch → ch'</text>
</g>
<g class="c-gray">
  <rect x="340" y="290" width="125" height="60" rx="8"/>
  <text class="th" x="402" y="316" text-anchor="middle">GroupNorm</text>
  <text class="ts" x="402" y="336" text-anchor="middle">scale-shift</text>
</g>
<g class="c-blue">
  <rect x="480" y="290" width="125" height="60" rx="8"/>
  <text class="th" x="542" y="316" text-anchor="middle">Conv 3×3</text>
  <text class="ts" x="542" y="336" text-anchor="middle">zero-init</text>
</g>
<line x1="185" y1="320" x2="198" y2="320" class="arr" marker-end="url(#arrow)"/>
<line x1="325" y1="320" x2="338" y2="320" class="arr" marker-end="url(#arrow)"/>
<line x1="465" y1="320" x2="478" y2="320" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="376" text-anchor="middle">output = skip(x) + h ; skip = Identity, or Conv if channels change</text>

<!-- Section: AttentionBlock zoom -->
<g class="c-gray">
  <rect x="40" y="410" width="600" height="170" rx="20"/>
</g>
<text class="th" x="60" y="436">Inside an AttentionBlock — repeated 21× (8 encoder, 1 middle, 12 decoder)</text>
<text class="ts" x="60" y="452">norm → qkv → attention → proj → + residual</text>

<g class="c-gray">
  <rect x="60" y="470" width="125" height="60" rx="8"/>
  <text class="th" x="122" y="496" text-anchor="middle">GroupNorm</text>
  <text class="ts" x="122" y="516" text-anchor="middle">per-channel</text>
</g>
<g class="c-amber">
  <rect x="200" y="470" width="125" height="60" rx="8"/>
  <text class="th" x="262" y="496" text-anchor="middle">QKV proj</text>
  <text class="ts" x="262" y="516" text-anchor="middle">1×1 conv</text>
</g>
<g class="c-coral">
  <rect x="340" y="470" width="125" height="60" rx="8"/>
  <text class="th" x="402" y="496" text-anchor="middle">Attention</text>
  <text class="ts" x="402" y="516" text-anchor="middle">softmax / flash</text>
</g>
<g class="c-amber">
  <rect x="480" y="470" width="125" height="60" rx="8"/>
  <text class="th" x="542" y="496" text-anchor="middle">Proj out</text>
  <text class="ts" x="542" y="516" text-anchor="middle">1×1 conv</text>
</g>
<line x1="185" y1="500" x2="198" y2="500" class="arr" marker-end="url(#arrow)"/>
<line x1="325" y1="500" x2="338" y2="500" class="arr" marker-end="url(#arrow)"/>
<line x1="465" y1="500" x2="478" y2="500" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="556" text-anchor="middle">output = x + proj_out( attention( qkv(norm(x)) ) )</text>

<!-- Legend -->
<rect x="60" y="600" width="14" height="14" fill="#378ADD"/>
<text class="ts" x="80" y="611">Conv (3×3 / 1×1 spatial conv)</text>
<rect x="340" y="600" width="14" height="14" fill="#D85A30"/>
<text class="ts" x="360" y="611">Attention (softmax / flash kernel)</text>
<rect x="60" y="624" width="14" height="14" fill="#BA7517"/>
<text class="ts" x="80" y="635">Linear / GEMM (incl. 1×1 conv proj)</text>
<rect x="340" y="624" width="14" height="14" fill="#888780"/>
<text class="ts" x="360" y="635">GroupNorm, SiLU, resize (non-GEMM)</text>
</svg>
